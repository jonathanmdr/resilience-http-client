# THIS FILE SHOULD BE CONTAINING FAKE DATA FOR TESTS ONLY

# DATABASE CONFIGURATIONS
database:
    url: localhost:27017
    schema-name: audit
    username: root
    password: root
    configuration:
        primary:
            uri: mongodb://${database.username}:${database.password}@${database.url}/${database.schema-name}?retryWrites=true&retryReads=true&w=majority&readPreference=primary&appName=${spring.application.name}
        default:
            uri: mongodb://${database.username}:${database.password}@${database.url}/${database.schema-name}?retryWrites=true&retryReads=true&w=majority&readPreference=secondaryPreferred&appName=${spring.application.name}

# SPRING CLOUD CONFIGURATION
    cloud:
        stream:
            binders:
                ecommerce:
                    environment:
                        spring:
                            cloud:
                                stream:
                                    kafka:
                                        binder:
                                            configuration:
                                                security:
                                                    protocol: PLAINTEXT

# LOGGING CONFIGURATION
logging:
    appender: CONSOLE

# APPLICATION CONFIGURATION
application:
    schedulers:
        enabled: false
        jobs:
            analysis-job:
                cron: "0/3 * * * * *"